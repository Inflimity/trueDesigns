<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Image Guide</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
            color: #333;
        }

        h1 {
            color: #db2777;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .list {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }

        .item {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background: #fff;
            text-align: center;
        }

        .file {
            font-family: monospace;
            color: #d32f2f;
            background: #fee;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.2em;
            display: block;
            margin-bottom: 5px;
        }

        .folder {
            font-family: monospace;
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Homepage Carousel Guide</h1>
    <p>These are the scrolling images on the Homepage.</p>
    <p><strong>Location:</strong> <span class="folder">assets/images/carousel/</span></p>
    <p><strong>Instruction:</strong> Save 6 distinct images as <strong>.webp</strong> files (recommended height: 450px)
        with these names:</p>

    <div class="list">
        <div class="item"><span class="file">c1.webp</span>Image 1</div>
        <div class="item"><span class="file">c2.webp</span>Image 2</div>
        <div class="item"><span class="file">c3.webp</span>Image 3</div>
        <div class="item"><span class="file">c4.webp</span>Image 4</div>
        <div class="item"><span class="file">c5.webp</span>Image 5</div>
        <div class="item"><span class="file">c6.webp</span>Image 6</div>
    </div>

</body>

</html>
